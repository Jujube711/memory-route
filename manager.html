<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15385f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml" />
  <title>记忆航线 · 布置挖空背诵</title>
  <style>
    :root { --navy:#123252; --blue:#3478f6; --teal:#1db6a3; --bg:#f3f7fb; --ink:#18243b; --muted:#718096; --line:#dfe7f1; }
    *{box-sizing:border-box}html{min-height:100%;overflow-x:hidden;background:var(--bg)}body{margin:0;min-height:100vh;min-height:100dvh;overflow-x:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,#d9f7f1,transparent 25%),radial-gradient(circle at 95% 10%,#dce9ff,transparent 30%),var(--bg)}
    button,input,textarea,select{font:inherit}button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}.shell{max-width:1120px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:15px;color:white;background:linear-gradient(145deg,var(--blue),var(--teal));font-size:22px}.brand h1{font-size:21px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.child-link{min-height:44px;display:flex;align-items:center;text-decoration:none;color:#2868a5;background:white;border:1px solid var(--line);padding:10px 14px;border-radius:13px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.step{padding:12px;border-radius:14px;text-align:center;background:rgba(255,255,255,.65);color:var(--muted);font-size:13px}.step.active{color:white;background:linear-gradient(135deg,#2d75d7,#20aa9e);box-shadow:0 8px 20px rgba(45,117,215,.18)}
    .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.panel{background:rgba(255,255,255,.95);border:1px solid rgba(221,230,240,.8);border-radius:24px;padding:22px;box-shadow:0 16px 45px rgba(41,72,108,.08)}.panel h2{font-size:18px;margin:0 0 16px}.label{display:block;font-size:13px;font-weight:700;margin:15px 0 8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}input[type=text],select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);background:#fbfcfe;outline:none}textarea{min-height:210px;resize:vertical;line-height:1.8}input:focus,textarea:focus,select:focus{border-color:#68a2e4;box-shadow:0 0 0 3px rgba(52,120,246,.1)}
    .upload{position:relative;display:grid;place-items:center;min-height:150px;border:2px dashed #bed0e3;border-radius:18px;background:#f8fbfe;overflow:hidden;text-align:center;padding:15px}.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}.upload img{display:none;max-height:180px;max-width:100%;border-radius:12px}.upload strong{display:block;margin-bottom:5px}.upload small{color:var(--muted)}.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.primary,.secondary,.danger{border:0;border-radius:14px;padding:12px 16px;cursor:pointer;font-weight:700}.primary{color:white;background:linear-gradient(135deg,var(--blue),var(--teal));box-shadow:0 9px 20px rgba(52,120,246,.18)}.secondary{color:#2b679e;background:#eaf3ff}.danger{color:#ae5b51;background:#fff0ee}.primary:disabled{opacity:.55;cursor:not-allowed}.tip{margin-top:9px;color:var(--muted);font-size:12px;line-height:1.6}.editor-note{padding:10px 12px;border-radius:12px;background:#fff8eb;color:#95602c;font-size:12px}.preview{min-height:310px;padding:22px;border-radius:20px;color:#26344a;background:linear-gradient(155deg,#effbfa,#eef4ff);line-height:2;font-size:16px;white-space:pre-wrap}.blank{display:inline-block;min-width:74px;margin:0 3px;border-bottom:2px solid #346f9f;color:transparent;text-align:center;line-height:1.35}.preview.show-answer .blank{color:#286b9e;background:rgba(255,255,255,.7);border-radius:6px;border-bottom-color:transparent}.answer-box{margin-top:14px;padding:14px;border-radius:15px;background:#f7f9fc;color:var(--muted);font-size:13px}.empty{color:#8b97a8;text-align:center;padding-top:80px}.status{min-height:20px;margin-top:10px;color:#278678;font-size:13px}.saved{display:none;margin-top:14px;padding:13px;border-radius:14px;color:#26745e;background:#e7f8f1}.saved.show{display:block}.task-list{display:grid;gap:10px}.saved-task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:15px;background:#fbfcfe}.saved-task .subject-dot{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;color:white;background:linear-gradient(145deg,#3478f6,#20b8a6);font-size:12px}.saved-task strong{display:block;font-size:14px;margin-bottom:4px}.saved-task small{color:var(--muted)}.saved-task button{border:0;border-radius:10px;padding:7px 9px;color:#a25d55;background:#fff0ee;cursor:pointer}.list-empty{padding:18px;text-align:center;color:var(--muted);background:#f7f9fc;border-radius:14px;font-size:13px}
    @media(max-width:780px){html,body{height:100%;overflow:hidden}body{padding:0}.shell{height:100vh;height:100dvh;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior-y:contain;padding:calc(20px + env(safe-area-inset-top)) 12px calc(38px + env(safe-area-inset-bottom))}.grid{grid-template-columns:1fr}.grid aside .panel{position:static!important}.steps{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;margin-bottom:18px}.brand{min-width:0}.brand h1{font-size:18px}.brand p{overflow-wrap:anywhere}.child-link{flex:0 0 auto;font-size:12px;padding:9px 10px}.panel{padding:17px;border-radius:19px}.upload{min-height:128px}.primary,.secondary,.danger{min-height:44px}input[type=text],select,textarea{font-size:16px}.saved-task{grid-template-columns:auto minmax(0,1fr) auto}.saved-task strong,.saved-task small{overflow-wrap:anywhere}}
    @media(max-width:480px){.shell{padding-left:10px;padding-right:10px}.logo{width:40px;height:40px;border-radius:13px}.brand{gap:9px}.brand h1{font-size:17px}.brand p{font-size:11px}.child-link{min-height:40px;padding:8px 9px}.steps{gap:7px;margin-bottom:12px}.step{padding:10px 7px;font-size:12px}.panel{padding:15px;border-radius:17px}.panel h2{font-size:17px}.actions{display:grid;grid-template-columns:1fr}.actions button{width:100%}textarea{min-height:170px}.preview{min-height:220px;padding:17px}.saved-task{grid-template-columns:38px minmax(0,1fr);gap:10px}.saved-task button{grid-column:2;justify-self:start;min-height:40px;padding:8px 13px}.list-empty{padding:16px 12px}.empty{padding-top:55px}}
    @media(max-width:350px){.shell{padding-left:8px;padding-right:8px}.brand p{display:none}.child-link{font-size:11px}.steps{grid-template-columns:1fr}.panel{padding:14px}.manager-gate{align-items:start!important;overflow-y:auto!important;padding:14px!important}.manager-gate-card{margin-top:28px;padding:22px!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="logo">🧭</div><div><h1>布置挖空背诵</h1><p>管理端 · 教材原文转背诵任务</p></div></div><a class="child-link" href="index.html">孩子端 →</a></header>
    <div class="steps"><div class="step active">1 上传 / 粘贴原文</div><div class="step">2 提取文字</div><div class="step">3 手动挖空</div><div class="step">4 预览发布</div></div>
    <section class="grid">
      <div>
        <article class="panel">
          <h2>① 教材内容</h2>
          <div class="row"><div><label class="label" for="subject">科目</label><select id="subject"><option>历史</option><option>地理</option><option>生物</option><option>英语</option></select></div><div><label class="label" for="title">任务名称</label><input id="title" type="text" placeholder="例如：第一课重点背诵" /></div></div>
          <label class="label">上传教材照片</label>
          <label class="upload" id="uploadBox"><input id="imageInput" type="file" accept="image/*" capture="environment" /><div id="uploadText"><strong>点击上传或拍摄教材页面</strong><small>照片尽量正对、清晰、无阴影</small></div><img id="imagePreview" alt="教材图片预览" /></label>
          <div class="actions"><button class="primary" id="ocrButton">识别图片文字</button><button class="secondary" id="useSample">填入示例原文</button></div>
          <div id="ocrStatus" class="status"></div>
          <label class="label" for="sourceText">提取结果（可以继续修改）</label>
          <textarea id="sourceText" placeholder="也可以直接把教材原文粘贴到这里……"></textarea>
        </article>
        <article class="panel" style="margin-top:18px">
          <h2>② 你来挖空</h2>
          <div class="editor-note">在下方文字中选中“答案文字”，再点击“挖空所选”。例如选中“公元前221”，孩子端会显示为横线。</div>
          <textarea id="clozeEditor" placeholder="先从上方提取或粘贴原文，再开始挖空"></textarea>
          <div class="actions"><button class="primary" id="blankSelection">挖空所选</button><button class="secondary" id="syncSource">使用上方原文</button><button class="danger" id="undoBlank">撤销上一次挖空</button></div>
          <div class="tip">编辑框里用 {{答案}} 保存挖空位置；这些答案不会在孩子的背诵页面直接显示。</div>
        </article>
      </div>
      <aside>
        <article class="panel" style="position:sticky;top:18px">
          <h2>③ 孩子端背诵预览</h2>
          <div id="preview" class="preview"><div class="empty">完成挖空后，这里会显示孩子看到的内容</div></div>
          <div class="actions"><button class="secondary" id="toggleAnswer">临时显示答案</button><button class="primary" id="saveTask">保存并发布任务</button></div>
          <div id="answerBox" class="answer-box">答案：暂无</div>
          <div id="saved" class="saved">任务已在线保存，孩子端会自动同步显示。</div>
        </article>
      </aside>
    </section>
    <article class="panel" style="margin-top:18px"><div class="top" style="margin:0 0 16px"><div><h2 style="margin:0">已发布的挖空任务</h2><p style="margin:5px 0 0;color:var(--muted);font-size:12px">孩子端会按这里的任务顺序显示</p></div><span id="taskCount" class="step active" style="padding:8px 12px">0 项</span></div><div id="taskList" class="task-list"></div></article>
  </main>
  <script src="assets/tesseract/tesseract.min.js"></script>
  <script src="assets/supabase.min.js?v=7"></script>
  <script src="config.js?v=7"></script>
  <script src="cloud-sync.js?v=8"></script>
  <script>
    const $ = s => document.querySelector(s);
    const source = $('#sourceText'), editor = $('#clozeEditor'), preview = $('#preview'), answerBox = $('#answerBox');
    let imageData = '', history = [], showing = false, ocrWorker;
    const getTasks=()=>window.MemoryRouteCloud?.getTasks() || [];
    $('#imageInput').addEventListener('change', event => {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { imageData = reader.result; $('#imagePreview').src = imageData; $('#imagePreview').style.display='block'; $('#uploadText').style.display='none'; };
      reader.readAsDataURL(file);
    });
    $('#ocrButton').addEventListener('click', async () => {
      if (!imageData) { $('#ocrStatus').textContent='请先上传一张教材照片。'; return; }
      $('#ocrButton').disabled=true; $('#ocrStatus').textContent='正在识别教材文字，首次使用可能需要稍等……';
      try {
        if (!window.Tesseract) throw new Error('文字识别组件加载失败，请刷新页面重试。');
        if (!ocrWorker) {
          ocrWorker = await Tesseract.createWorker('chi_sim+eng', 1, {
            workerPath: './assets/tesseract/worker.min.js',
            corePath: './assets/tesseract/core',
            langPath: './assets/tesseract/lang',
            gzip: false,
            workerBlobURL: false,
            logger: message => {
              if (message.progress) $('#ocrStatus').textContent=`正在识别教材文字 ${Math.round(message.progress*100)}%`;
            }
          });
        }
        const result=await ocrWorker.recognize(imageData);
        const text=result.data.text.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
        source.value=text; editor.value=text; updatePreview(); $('#ocrStatus').textContent='文字已提取，请检查错别字后开始挖空。';
      }
      catch(error){ $('#ocrStatus').textContent=error.message || '识别失败，请尝试粘贴原文。'; }
      finally{$('#ocrButton').disabled=false;}
    });
    $('#useSample').addEventListener('click',()=>{const text='公元前221年，秦王嬴政完成统一大业，建立秦朝，定都咸阳。秦的统一，结束了春秋战国以来长期争战混乱的局面，建立起我国历史上第一个统一的多民族的封建国家。';source.value=text;editor.value=text;updatePreview();});
    $('#syncSource').addEventListener('click',()=>{editor.value=source.value;history=[];updatePreview();});
    $('#blankSelection').addEventListener('click',()=>{const start=editor.selectionStart,end=editor.selectionEnd;if(start===end){alert('请先在文字中选中要挖空的答案。');return;}const value=editor.value, selected=value.slice(start,end);if(selected.includes('{{')||selected.includes('}}')){alert('请不要重复选择已经挖空的内容。');return;}history.push(value);editor.value=value.slice(0,start)+'{{'+selected+'}}'+value.slice(end);editor.focus();editor.setSelectionRange(start,start+selected.length+4);updatePreview();});
    $('#undoBlank').addEventListener('click',()=>{if(!history.length)return;editor.value=history.pop();updatePreview();});
    editor.addEventListener('input',updatePreview); source.addEventListener('input',()=>{if(!editor.value.trim()){editor.value=source.value;updatePreview();}});
    function escapeHtml(text){return String(text ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function parse(){const answers=[];const safe=escapeHtml(editor.value.trim());const html=safe.replace(/\{\{(.*?)\}\}/gs,(_,answer)=>{answers.push(answer);const width=Math.max(74,Math.min(160,answer.length*18));return `<span class="blank" style="min-width:${width}px">${answer}</span>`;});return{answers,html};}
    function updatePreview(){const {answers,html}=parse();preview.innerHTML=html||'<div class="empty">完成挖空后，这里会显示孩子看到的内容</div>';preview.classList.toggle('show-answer',showing);answerBox.textContent=answers.length?'答案：'+answers.map((a,i)=>`${i+1}. ${a}`).join('　'):'答案：暂无';$('#saved').classList.remove('show');}
    $('#toggleAnswer').addEventListener('click',()=>{showing=!showing;preview.classList.toggle('show-answer',showing);$('#toggleAnswer').textContent=showing?'隐藏答案':'临时显示答案';});
    function renderTasks(){const tasks=getTasks();$('#taskCount').textContent=`${tasks.length} 项`;$('#taskList').innerHTML=tasks.length?tasks.map(task=>`<div class="saved-task"><span class="subject-dot">${escapeHtml(task.subject)}</span><span><strong>${escapeHtml(task.title)}</strong><small>${task.answers.length} 处挖空 · ${new Date(task.createdAt).toLocaleDateString('zh-CN')}</small></span><button data-delete="${task.id}">删除</button></div>`).join(''):'<div class="list-empty">还没有发布任务，完成第一篇教材挖空后会显示在这里。</div>';}
    $('#taskList').addEventListener('click',async event=>{const button=event.target.closest('[data-delete]');if(!button)return;try{await window.MemoryRouteCloud.deleteTask(button.dataset.delete);renderTasks();}catch(error){alert(`在线删除失败：${error.message}`);}});
    $('#saveTask').addEventListener('click',async()=>{const {answers}=parse();if(!editor.value.trim()||!answers.length){alert('请先填写原文，并至少挖空一处。');return;}const button=$('#saveTask');const task={id:crypto.randomUUID?crypto.randomUUID():`task-${Date.now()}`,subject:$('#subject').value,title:$('#title').value.trim()||'挖空背诵任务',content:editor.value,answers,createdAt:new Date().toISOString()};button.disabled=true;button.textContent='正在保存…';try{await window.MemoryRouteCloud.saveTask(task);$('#saved').classList.add('show');renderTasks();}catch(error){alert(`在线保存失败：${error.message}`);}finally{button.disabled=false;button.textContent='保存并发布任务';}});
    window.MemoryRouteCloud?.subscribe(renderTasks);
    renderTasks();
    if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.error));
  </script>
</body>
</html>
